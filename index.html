<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6b4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="運転日報">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>運転日報</title>
<style>
  :root{
    --bg:#f3f4f1; --panel:#ffffff; --ink:#1d2421; --sub:#5d6862; --line:#d5d9d3;
    --go:#1f6b4a; --go-ink:#fff; --warn:#a4380f; --blue:#1d4f8a; --red:#d32f2f;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141816; --panel:#1e2421; --ink:#eef2ee; --sub:#9aa69f; --line:#34403a;
      --go:#3fae7e; --go-ink:#06140d; --warn:#ff9a70; --blue:#7fb2ee; --red:#ff5a5a; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;font-size:18px;line-height:1.6}
  html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
  body{-webkit-user-select:none;user-select:none}
  input,pre{-webkit-user-select:text;user-select:text}
  main{max-width:520px;margin:0 auto;min-height:100dvh;
    padding:calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 40px) calc(env(safe-area-inset-left) + 16px)}
  button{touch-action:manipulation;min-height:60px}
  #net{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);margin-left:8px}
  #net.off{color:var(--warn);border-color:var(--warn)}
  input[type=number]{font-size:32px}
  h1{font-size:20px;margin:0 0 4px}
  .meta{color:var(--sub);font-size:14px;margin-bottom:20px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
  .msg{font-size:24px;font-weight:700;margin:0 0 12px;line-height:1.4}
  .note{color:var(--sub);font-size:15px;margin:0 0 12px}
  label{display:block;font-weight:700;margin-bottom:6px}
  input[type=number]{width:100%;font-size:28px;padding:12px;border:2px solid var(--line);border-radius:8px;
    background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
  input[type=number]:focus{outline:3px solid var(--blue);border-color:var(--blue)}
  button{width:100%;font:inherit;font-size:22px;font-weight:700;padding:18px;border:0;border-radius:10px;
    background:var(--go);color:var(--go-ink);cursor:pointer;margin-top:12px}
  button.alt{background:var(--blue);color:#fff}
  textarea{width:100%;font:inherit;font-size:18px;padding:12px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical;min-height:140px}
  textarea:focus{outline:3px solid var(--blue);border-color:var(--blue)}
  button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);font-size:18px;padding:12px}
  button:disabled{opacity:.45;cursor:wait}
  button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row button{margin-top:12px;font-size:20px;padding:18px 8px}
  video{width:100%;border-radius:8px;background:#000;aspect-ratio:1/1;object-fit:cover}
  .err{color:var(--warn);font-weight:700;min-height:1.6em}
  .status{color:var(--sub);font-size:15px;min-height:1.6em}
  .log{font-size:14px;color:var(--sub);margin:0;padding:0;list-style:none}
  .grp{border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:0;background:var(--panel)}
  .gap{min-height:12px;padding:2px 0}
  .ins{width:auto;min-height:30px;margin:0;padding:0 16px 0 6px;background:transparent;border:0;border-radius:6px;
    display:flex;align-items:center;justify-content:flex-start}
  .tri{display:block;width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;
    border-left:15px solid var(--blue);transition:transform .15s}
  .ins[aria-expanded="true"] .tri{transform:rotate(90deg)}
  .ins.rest .tri{border-left-color:var(--red)}
  .grp.sel{border-color:var(--blue);background:var(--panel);background:color-mix(in srgb, var(--blue) 14%, var(--panel))}
  .mk{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--blue);font-size:15px;margin-bottom:8px}
  .mk input{width:26px;height:26px;margin:0;accent-color:var(--blue)}
  li.mhint{color:var(--blue);font-weight:700;font-size:14px;padding:0 0 10px}
  .mini{border:2px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:14px;color:var(--ink)}
  .shbar{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;
    background:var(--panel);border-bottom:1px solid var(--line);font-weight:700}
  .shbar button{width:auto;min-height:40px;margin:0;padding:6px 18px;font-size:16px}
  .vrow{display:flex;gap:8px;align-items:stretch}
  .vrow input[type=number]{flex:1;width:auto;min-width:0}
  .micBtn{width:auto;min-height:0;margin:0;padding:0 14px;font-size:22px;font-weight:700;
    background:transparent;color:var(--ink);border:2px solid var(--line)}
  .micBtn.rec{background:var(--warn);color:#fff;border-color:var(--warn);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}
  #topR button.tiny{min-height:20px;padding:1px 7px;font-size:10px;font-weight:400;opacity:.5;border-color:transparent;color:var(--sub)}
  .pick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;margin-top:10px;padding:12px 14px;
    font-size:20px;font-weight:700;background:transparent;color:var(--ink);border:2px solid var(--line)}
  .pick .mr{font-size:12px;font-weight:400;color:var(--sub);line-height:1.3}
  .pick.on{border-color:var(--blue);background:var(--panel);background:color-mix(in srgb, var(--blue) 14%, var(--panel))}
  #drv{width:100%;font-size:24px;padding:12px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:14px}
  #drv:focus{outline:3px solid var(--blue);border-color:var(--blue)}
  .seg{background:transparent;color:var(--ink);border:2px solid var(--line)}
  .seg.on{background:var(--go);color:var(--go-ink);border-color:var(--go)}
  .rec + .rec{margin-top:10px}
  .log b{color:var(--ink)}
  .log button.tag{width:auto;min-height:44px;margin:0 6px 0 0;padding:4px 12px;font-size:16px;border-radius:8px;
    background:transparent;color:var(--blue);border:1px solid var(--blue);text-decoration:underline}
  .edit{margin-top:10px;padding:14px;border:2px solid var(--blue);border-radius:10px;color:var(--ink);font-size:16px;background:var(--panel)}
  .edit label{font-size:14px;margin:10px 0 4px}
  .gsec{border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
  .edit input,.edit select{width:100%;font:inherit;font-size:18px;padding:10px;border:2px solid var(--line);
    border-radius:8px;background:var(--bg);color:var(--ink)}
  .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  #topR{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
  #topR .tr{display:flex}
  #topR button{width:auto;min-height:30px;margin:0 0 0 6px;padding:3px 8px;font-size:12px;font-weight:600;
    background:transparent;color:var(--sub);border:1px solid var(--line);border-radius:6px}
  .mback{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;
    padding:16px;z-index:10;overflow:auto}
  .ck{width:100%;border-collapse:collapse;font-size:16px;margin-bottom:8px}
  .ck td{padding:8px 4px;border-bottom:1px solid var(--line)}
  .ck td:last-child{text-align:right;white-space:nowrap}
  .ck button.okb{width:auto;min-height:44px;margin:0;padding:6px 12px;font-size:15px;font-weight:600;
    background:transparent;color:var(--ink);border:2px solid var(--line)}
  .ck button.okb.on{background:var(--go);color:var(--go-ink);border-color:var(--go)}
  #modal2 .mback{z-index:20}
  .mpanel{width:100%;max-width:480px;margin:0}
  .edit .del{width:auto;min-height:44px;margin-top:28px;padding:8px 4px;font-size:14px;font-weight:400;
    background:transparent;color:var(--sub);text-decoration:underline}
  .edit .row button{font-size:18px;padding:14px 6px}
  pre{white-space:pre;overflow-x:auto;font-size:12px;background:var(--bg);padding:12px;border-radius:8px;
    border:1px solid var(--line);max-height:260px}
</style>
</head>
<body>
<main>
  <header class="hd"><h1>運転日報<span id="net"></span></h1><div id="topR"></div></header>
  <div class="meta" id="meta"></div>
  <div id="view"></div>
  <ul class="log" id="log"></ul>
</main>
<div id="modal"></div>
<div id="modal2"></div>

<script>
"use strict";
// 点呼を行う運行管理者(補助者)。追加するときはここに足す
const MANAGERS = [
  {name:"中村泰輔", role:"運行管理者・整備管理補助者", alias:["中村"]},
  {name:"内田麗子", role:"運行管理補助者・整備管理補助者", alias:["内田レ"]},
  {name:"内田洋", role:"運行管理補助者・整備管理者", alias:["内田ヒ"]}
];   // alias は以前の記録(旧表記)の名前も読み取るためのもの
function mgrFromNote(note){
  const m = MANAGERS.find(x=>note.endsWith(x.name) || x.alias.some(a=>note.endsWith(a)));
  return m ? m.name : "";
}
const KEY = "unten-nippo-v1";
const view = document.getElementById("view");
const logEl = document.getElementById("log");
const metaEl = document.getElementById("meta");

// ---- 状態 ----
// step: home | inspect | scan | odoStart | arrive | depart | done
let S = load() || fresh();
S.rows.forEach(r=>{ if(r.kind==="違法帰庫") r.kind = "帰庫"; });
function fresh(){ return {step:"home", rows:[], manager:"", vehicle:"", driver:"", report:"", reportTime:""}; }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} schedulePrewarm(); }
// 記録が変わるたびに、日報PDFを裏で作り直しておく(「日報」「日報作成」を押したらすぐ開けるように)
let prewarmTimer = null;
function schedulePrewarm(){
  clearTimeout(prewarmTimer);
  prewarmTimer = setTimeout(()=>{ if(S.rows.length && (S.step==="arrive"||S.step==="depart"||S.step==="done")) pdfFile(); }, 700);
}
function updateMeta(){
  metaEl.textContent = [S.vehicle ? `車両: ${S.vehicle}` : "", S.driver ? `乗務員: ${S.driver}` : "", S.manager ? `点呼者: ${S.manager}` : ""].filter(Boolean).join(" / ");
}
function go(step){ S.step = step; save(); render(); }

const pad = n => String(n).padStart(2,"0");
function now(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function makeRow(kind, o={}){
  return {kind, time:o.time||now(), odo:o.odo??"", fuel:o.fuel??"", lat:o.lat??"", lng:o.lng??"", addr:o.addr||"", note:o.note||"", end:o.end||""};
}
function addRow(kind, o={}){ S.rows.push(makeRow(kind, o)); save(); }

// ---- 位置情報 ----
function getPosition(){
  return new Promise((res, rej)=>{
    if(!navigator.geolocation) return rej(new Error("位置情報に未対応"));
    navigator.geolocation.getCurrentPosition(res, rej, {enableHighAccuracy:true, timeout:15000, maximumAge:0});
  });
}
// ---- 住所の表記 ----
// 都道府県・市区名は省略し、町名+丁目の数字だけにする(例: 銀座４)。東京都以外は頭に都道府県の頭文字を付ける(例: 神）大倉山２)
const PREF_INITIAL = "北青岩宮秋山福茨栃群埼千東神新富石福山長岐静愛三滋京大兵奈和鳥島岡広山徳香愛高福佐長熊大宮鹿沖";   // 都道府県コード01〜47の頭文字
const KNUM = {"〇":0,"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9};
function toZen(n){ return String(n).replace(/\d/g, d=>"０１２３４５６７８９"[d]); }
function chomeNum(t){
  if(/^[0-9０-９]+$/.test(t)) return Number(t.replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)));
  const k = t.split("十");
  if(k.length===2) return (k[0] ? KNUM[k[0]] : 1)*10 + (k[1] ? KNUM[k[1]] : 0);
  return Number([...t].map(c=>KNUM[c]).join(""));
}
function composeAddr(prefIni, town, chome){
  return (prefIni ? prefIni+"）" : "") + town + (chome ? toZen(chomeNum(chome)) : "");
}
function splitChome(name){
  const m = String(name).match(/^(.+?)([〇一二三四五六七八九十0-9０-９]+)丁目$/);
  return m ? {town:m[1], chome:m[2]} : {town:String(name), chome:""};
}
// 国土地理院の逆ジオコーダー(町名+丁目まで。番地は取らない)
async function reverseGsi(lat, lng){
  const r = await fetch(`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${lat}&lon=${lng}`);
  if(!r.ok) throw new Error("住所取得エラー");
  const res = (await r.json()).results;
  if(!res || !res.muniCd || !res.lv01Nm) throw new Error("住所なし");
  const code = Number(String(res.muniCd).slice(0,2));
  const {town, chome} = splitChome(res.lv01Nm);
  return composeAddr(code===13 ? "" : PREF_INITIAL[code-1], town, chome);
}
// 予備: OpenStreetMap(Nominatim)
async function reverseNominatim(lat, lng){
  const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=ja&lat=${lat}&lon=${lng}`);
  if(!r.ok) throw new Error("住所取得エラー");
  const j = await r.json(), a = j.address || {};
  const parts = (j.display_name||"").split(",").map(x=>x.trim());
  let town = "", chome = "";
  for(let i=0; i<parts.length; i++){
    let m = parts[i].match(/^(.+?)([〇一二三四五六七八九十0-9０-９]+)丁目$/);
    if(m){ town = m[1]; chome = m[2]; break; }
    m = parts[i].match(/^([〇一二三四五六七八九十0-9０-９]+)丁目$/);
    if(m && parts[i+1]){ chome = m[1]; town = parts[i+1]; break; }
  }
  if(!town) town = a.suburb || a.neighbourhood || a.quarter || a.village || a.town || "";
  if(!town) throw new Error("住所なし");
  const st = a.state || a.province || "";
  return composeAddr(st && st!=="東京都" ? st[0] : "", town, chome);
}
async function reverseGeocode(lat, lng){
  try{ return await reverseGsi(lat, lng); }
  catch(e){ return await reverseNominatim(lat, lng); }
}
async function getPlace(setStatus){
  setStatus("位置情報を取得中…");
  let lat="", lng="", addr="";
  try{
    const p = await getPosition();
    lat = p.coords.latitude.toFixed(6); lng = p.coords.longitude.toFixed(6);
    if(navigator.onLine){
      setStatus("住所を取得中…");
      try{ addr = await Promise.race([reverseGeocode(lat, lng), new Promise((_,j)=>setTimeout(j,8000))]); }
      catch(e){ addr = ""; }
    }
  }catch(e){
    addr = "(位置情報取得失敗)";
    lat = ""; lng = "";
  }
  return {lat, lng, addr};
}

// ---- 出発点呼: 運行管理者(補助者)を画面で選ぶ ----
function pickHtml(){
  return `<div role="radiogroup" aria-label="点呼者">${MANAGERS.map((m,i)=>`<button type="button" class="pick" role="radio" aria-checked="false" data-i="${i}"><span>${escH(m.name)}</span><small class="mr">（${escH(m.role)}）</small></button>`).join("")}</div>
    <button id="pk-ok" disabled>この人で記録</button>`;
}
function bindPick(){
  let sel = null;
  const ok = document.getElementById("pk-ok");
  document.querySelectorAll(".pick").forEach(b=>b.onclick=()=>{
    sel = Number(b.dataset.i);
    document.querySelectorAll(".pick").forEach(x=>{ const on = x===b; x.classList.toggle("on", on); x.setAttribute("aria-checked", on); });
    ok.disabled = false;
  });
  ok.onclick = ()=>{ if(sel!==null) chooseManager(MANAGERS[sel].name); };
}
function chooseManager(name){
  S.manager = name;
  addRow("出発点呼", {note:`運行管理者・整備管理者(補助者): ${S.manager}`});
  go("odoStart");
}

// ---- CSV ----
function csvText(){
  const head = ["種別","日時","車両番号","乗務員","Odoメーター","給油量(L)","緯度","経度","住所","備考","終了日時"];
  const esc = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const rep = (S.report||"").trim();   // 報告事項は入力があるときだけ最後の行に付ける
  const extra = rep ? [["報告事項", S.reportTime || (S.rows[S.rows.length-1]||{}).time || now(), S.vehicle||"", S.driver||"", "", "", "", "", "", rep, ""]] : [];
  return [head, ...S.rows.map(r=>[r.kind,r.time,S.vehicle||"",S.driver||"",r.odo,r.fuel,r.lat,r.lng,r.addr,r.note,r.end]), ...extra]
    .map(a=>a.map(esc).join(",")).join("\r\n");
}
function csvFile(){
  const name = `運転日報_${(S.rows[0]?.time||now()).slice(0,10)}.csv`;
  return new File(["\uFEFF"+csvText()], name, {type:"text/csv"});
}
function download(){
  const f = csvFile(), a = document.createElement("a");
  a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
// ---- 過去の日報(直近2回分) ----
// 今回の日報(作業中)+過去2回分=合計3回分だけを端末に残し、それ以上は消去する
const HKEY = "unten-nippo-hist-v1", HIST_MAX = 2;
function loadHist(){ try{ const h = JSON.parse(localStorage.getItem(HKEY)); return Array.isArray(h) ? h.filter(e=>e && e.S && Array.isArray(e.S.rows)) : []; }catch(e){ return []; } }
function saveHist(h){ try{ localStorage.setItem(HKEY, JSON.stringify(h.slice(0, HIST_MAX))); }catch(e){} }
function histLabel(s){
  const t = (s.rows[0]||{}).time || "";
  const d = new Date(t.slice(0,10)+"T00:00:00"), wd = ["日","月","火","水","木","金","土"];
  const day = isNaN(d) ? "日付不明" : `${d.getFullYear()}年${pad(d.getMonth()+1)}月${pad(d.getDate())}日(${wd[d.getDay()]})`;
  return `${day}${t.length>=16 ? " "+t.slice(11,16)+"〜" : ""}${s.vehicle ? "　車両 "+s.vehicle : ""}`;
}
function openPast(){
  const h = loadHist();
  document.getElementById("modal").innerHTML = `<div class="mback"><div class="panel mpanel" role="dialog" aria-modal="true">
    <p class="msg" style="font-size:20px">過去の日報を呼び出す</p>
    <p class="note">過去２回分のデータのみ保存されています</p>
    ${h.length ? h.map((e,i)=>`<button class="alt past-pick" data-i="${i}">${escH(histLabel(e.S))}</button>`).join("") : '<p class="note">呼び出せる日報はありません</p>'}
    <button id="past-close" class="ghost">閉じる</button></div></div>`;
  document.getElementById("past-close").onclick = ()=>{ document.getElementById("modal").innerHTML = ""; };
  document.querySelectorAll(".past-pick").forEach(b=>b.onclick = ()=>recallPast(Number(b.dataset.i)));
}
// 選んだ日報を作業中の日報として開き、終業後点検の画面へ移る(その日報は過去分の一覧から外れる)
function recallPast(i){
  const h = loadHist(), e = h[i]; if(!e) return;
  h.splice(i,1);
  S = e.S; S.step = "done"; reportOpen = false;
  save(); saveHist(h);
  render();
}
// 「本日の業務を終了する」: 今の日報を過去分の先頭に入れ、古いものから消す
function archiveCurrent(){
  if(!S.rows.length) return;
  const h = loadHist(); h.unshift({S}); saveHist(h);
}

// ---- 日報PDF(端末内で生成。外部ライブラリ不要) ----
// nippo.html を非表示のiframeで開き、紙面を画像化してA4横のPDFに包む
let pdfCache = null, pdfErr = null;
const nippoKey = () => localStorage.getItem(KEY) || "";
const blobToDataURL = b => new Promise((ok,ng)=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=ng; r.readAsDataURL(b); });
// 日報ページ(nippo.html)の本文を取得し、画面外の iframe に srcdoc として直接読み込む。
// (iframe の src で別ページを開く方法は、iPhone では読み込めないことがあったため使わない)
async function loadNippoFrame(){
  let res;
  try{ res = await fetch("nippo.html"); }catch(e){ throw new Error("日報ページを取得できません(通信エラー)"); }
  if(!res.ok) throw new Error("日報ページを取得できません(HTTP " + res.status + ")");
  const html = (await res.text()).replace("<head>", "<head><script>window.__err=[];addEventListener('error',function(e){__err.push(e.message)})<\/script>");
  const f = document.createElement("iframe");
  f.style.cssText = "position:fixed;left:0;top:0;width:1200px;height:1800px;border:0;opacity:0;pointer-events:none;z-index:-1";
  f.setAttribute("aria-hidden", "true"); f.srcdoc = html; document.body.appendChild(f);
  const t0 = Date.now();
  return new Promise((ok,ng)=>{
    (function wait(){
      let sh = null, d = null;
      try{ d = f.contentDocument; sh = d && d.getElementById("sheet"); }catch(e){}
      if(sh && sh.childElementCount > 0) return ok(f);
      if(Date.now() - t0 > 8000){
        let err = ""; try{ err = (f.contentWindow.__err || []).join(" / "); }catch(e){}
        f.remove();
        return ng(new Error("日報ページを表示できませんでした(" + (d ? "文書あり" : "文書なし") + (sh ? ",紙面空" : ",紙面なし") + (err ? ",エラー:" + err : "") + ")"));
      }
      setTimeout(wait, 50);
    })();
  });
}
// 日報の画面(nippo.html)を、各要素の位置を読み取って canvas に直接描く。
// SVGの foreignObject 経由で描く方法は、Safari(iPhone)で canvas が「汚染」扱いになり PDF に変換できないため使わない。
const px = v => parseFloat(v) || 0;
function radiusOf(cs, w, h){
  const v = cs.borderTopLeftRadius;
  if(!v || v==="0px") return {r:0};
  if(v.includes("%")){ const p = parseFloat(v); return p >= 50 ? {ell:true} : {r:p/100*Math.min(w,h)}; }
  return {r:Math.min(parseFloat(v), w/2, h/2)};
}
function pathBox(cx, x, y, w, h, rad){
  cx.beginPath();
  if(rad.ell){ cx.ellipse(x+w/2, y+h/2, Math.max(w/2,0), Math.max(h/2,0), 0, 0, Math.PI*2); return; }
  const r = Math.max(0, Math.min(rad.r||0, w/2, h/2));
  if(!r){ cx.rect(x, y, w, h); return; }
  cx.moveTo(x+r, y); cx.arcTo(x+w, y, x+w, y+h, r); cx.arcTo(x+w, y+h, x, y+h, r); cx.arcTo(x, y+h, x, y, r); cx.arcTo(x, y, x+w, y, r); cx.closePath();
}
function paintBorders(cx, cs, x, y, w, h, rad, collapse){
  const sd = ["Top","Right","Bottom","Left"].map(k=>({wd:px(cs["border"+k+"Width"]), c:cs["border"+k+"Color"], st:cs["border"+k+"Style"]}))
    .map(b=>(b.st==="none"||b.st==="hidden") ? {...b, wd:0} : b);
  const [t,r,b,l] = sd;
  if(!(t.wd||r.wd||b.wd||l.wd)) return;
  if((rad.ell || rad.r>0) && t.wd===r.wd && r.wd===b.wd && b.wd===l.wd && t.c===l.c){
    const bw = t.wd; pathBox(cx, x+bw/2, y+bw/2, w-bw, h-bw, rad.ell ? rad : {r:Math.max(0,rad.r-bw/2)});
    cx.lineWidth = bw; cx.strokeStyle = t.c; cx.stroke(); return;
  }
  const e = collapse ? 0.5 : 0, f = (bd, X, Y, W, H)=>{ if(bd.wd){ cx.fillStyle = bd.c; cx.fillRect(X, Y, W, H); } };
  if(collapse){   // 罫線を共有する表: 罫線は枠の境目を中心に引く
    f(t, x, y-t.wd/2, w, t.wd); f(b, x, y+h-b.wd/2, w, b.wd); f(l, x-l.wd/2, y, l.wd, h); f(r, x+w-r.wd/2, y, r.wd, h);
  }else{
    f(t, x, y, w, t.wd); f(b, x, y+h-b.wd, w, b.wd); f(l, x, y, l.wd, h); f(r, x+w-r.wd, y, r.wd, h);
  }
}
function paintText(n, cx, d, o, cs){
  const str = n.nodeValue; if(!str || !str.trim()) return;
  cx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`; cx.fillStyle = cs.color; cx.textBaseline = "middle"; cx.textAlign = "left";
  const rg = d.createRange(); let i = 0;
  for(const ch of str){
    const L = ch.length;
    if(ch.trim()){
      rg.setStart(n, i); rg.setEnd(n, i+L);
      const q = rg.getClientRects()[0];
      if(q) cx.fillText(ch, q.left-o.left, (q.top+q.bottom)/2 - o.top);
    }
    i += L;
  }
}
function paintEl(el, cx, d, w, o){
  const cs = w.getComputedStyle(el);
  if(cs.display==="none" || cs.visibility==="hidden") return;
  const r = el.getBoundingClientRect(), x = r.left-o.left, y = r.top-o.top, wd = r.width, ht = r.height, tag = el.tagName;
  if(tag==="IMG"){ if(el.naturalWidth) cx.drawImage(el, x, y, wd, ht); return; }
  const rad = radiusOf(cs, wd, ht);
  const bg = cs.backgroundColor;
  if(bg && bg!=="transparent" && bg!=="rgba(0, 0, 0, 0)"){ cx.fillStyle = bg; pathBox(cx, x, y, wd, ht, rad); cx.fill(); }
  const line = (x1,y1,x2,y2,c,lw)=>{ cx.beginPath(); cx.moveTo(x1,y1); cx.lineTo(x2,y2); cx.lineWidth = lw; cx.strokeStyle = c; cx.stroke(); };
  if(el.classList.contains("diag")) line(x, y, x+wd, y+ht, "#bdc3c7", 1);             // 給油表の見出しの斜線(左上→右下)
  if(el.matches(".rep.none")) line(x+wd, y, x, y+ht, "#555", 1.5);                    // 報告事項が空のときの斜線(右上→左下)
  const tbl = (tag==="TD"||tag==="TH") ? el.closest("table") : null;
  paintBorders(cx, cs, x, y, wd, ht, rad, !!(tbl && w.getComputedStyle(tbl).borderCollapse==="collapse"));
  const clip = cs.overflowX!=="visible" || cs.overflowY!=="visible";
  if(clip){ cx.save(); pathBox(cx, x, y, wd, ht, rad); cx.clip(); }
  if(tag==="INPUT"){
    const v = el.value;
    if(v){
      cx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`; cx.fillStyle = cs.color; cx.textBaseline = "middle"; cx.textAlign = "left";
      cx.fillText(v, x + px(cs.borderLeftWidth) + px(cs.paddingLeft), y + ht/2);
    }
  }else{
    for(const n of el.childNodes){
      if(n.nodeType===3) paintText(n, cx, d, o, cs);
      else if(n.nodeType===1) paintEl(n, cx, d, w, o);
    }
  }
  if(clip) cx.restore();
}
async function nippoJpeg(){
  const fr = await loadNippoFrame();
  try{
    const d = fr.contentDocument, w = fr.contentWindow, sheet = d.getElementById("sheet");
    sheet.style.setProperty("--z","1"); sheet.style.margin = "0";
    try{ await d.fonts.ready; }catch(e){}
    await Promise.all([...sheet.querySelectorAll("img")].map(im=>im.decode ? im.decode().catch(()=>{}) : null));
    const o = sheet.getBoundingClientRect(), W = 1200, H = Math.ceil(o.height), K = 2;
    const cv = document.createElement("canvas"); cv.width = W*K; cv.height = H*K;
    const cx = cv.getContext("2d"); cx.scale(K, K); cx.fillStyle = "#fff"; cx.fillRect(0, 0, W, H);
    paintEl(sheet, cx, d, w, o);
    const blob = await new Promise(ok=>cv.toBlob(ok, "image/jpeg", 0.92));
    if(!blob) throw new Error("画像の作成に失敗");
    return {jpg:new Uint8Array(await blob.arrayBuffer()), pw:cv.width, ph:cv.height};
  } finally { fr.remove(); }
}
function jpegToPdf({jpg,pw,ph}){
  const PW = 842, PH = 595, M = 28.35;                       // A4横・余白10mm
  const k = Math.min((PW-2*M)/pw, (PH-2*M)/ph), w = pw*k, h = ph*k, x = (PW-w)/2, y = PH-M-h;
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
  const put = b => { const u = typeof b==="string" ? enc.encode(b) : b; parts.push(u); len += u.length; };
  const content = `q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im0 Do Q`;
  put("%PDF-1.4\n");
  offs[1]=len; put("1 0 obj\n<</Type/Catalog/Pages 2 0 R>>\nendobj\n");
  offs[2]=len; put("2 0 obj\n<</Type/Pages/Kids[3 0 R]/Count 1>>\nendobj\n");
  offs[3]=len; put(`3 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${PW} ${PH}]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>\nendobj\n`);
  offs[4]=len; put(`4 0 obj\n<</Type/XObject/Subtype/Image/Width ${pw}/Height ${ph}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpg.length}>>\nstream\n`); put(jpg); put("\nendstream\nendobj\n");
  offs[5]=len; put(`5 0 obj\n<</Length ${content.length}>>\nstream\n${content}\nendstream\nendobj\n`);
  const xref = len;
  put("xref\n0 6\n0000000000 65535 f \n" + [1,2,3,4,5].map(n=>String(offs[n]).padStart(10,"0")+" 00000 n \n").join("") +
      `trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts, {type:"application/pdf"});
}
async function makePdf(){
  const blob = jpegToPdf(await nippoJpeg());
  return new File([blob], `運転日報_${(S.rows[0]?.time||now()).slice(0,10)}.pdf`, {type:"application/pdf"});
}
// 画面表示時に先に作っておく(「日報作成」を押したときの待ち時間を減らす)。記録が変われば作り直す
function pdfFile(){
  const key = nippoKey();
  if(!pdfCache || pdfCache.key!==key){
    const c = {key};
    c.p = makePdf().then(f=>{ c.file = f; return f; }, e=>{ pdfErr = e; console.error(e); if(pdfCache===c) pdfCache=null; return null; });
    pdfCache = c;
  }
  return pdfCache.p;
}
function saveFile(f){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
// 「日報作成」「日報」: 日報PDFを開く。裏で作成済みならその場で開く。
// まだなら、この画面のまま「作成しています…」を出し、できあがったら「日報PDFを開く」ボタンを出す。
// (作成を待つあいだ別の画面を開くと、アプリが裏に回って作成が止まるため、先に別画面は開かない)
async function openReport(){
  if(pdfCache && pdfCache.key===nippoKey() && pdfCache.file){
    const url = URL.createObjectURL(pdfCache.file);
    if(!window.open(url, "_blank")) location.href = url;
    setTimeout(()=>URL.revokeObjectURL(url), 300000);
    return;
  }
  const m = document.getElementById("modal"), close = ()=>{ m.innerHTML = ""; };
  const panel = inner => { m.innerHTML = `<div class="mback"><div class="panel mpanel" role="dialog" aria-modal="true">${inner}</div></div>`; };
  let cancelled = false;
  panel('<p class="msg" style="font-size:20px">日報PDFを作成しています…</p><button id="rp-x" class="ghost">閉じる</button>');
  document.getElementById("rp-x").onclick = ()=>{ cancelled = true; close(); };
  const pdf = await pdfFile();
  if(cancelled) return;
  if(!pdf){
    panel(`<p class="msg" style="font-size:20px">日報PDFを作成できませんでした</p><p class="note">原因: ${escH((pdfErr && (pdfErr.message || pdfErr.name)) || "不明")}</p><button id="rp-x" class="ghost">閉じる</button>`);
    document.getElementById("rp-x").onclick = close; return;
  }
  const url = URL.createObjectURL(pdf);
  panel('<p class="msg" style="font-size:20px">日報PDFができました</p><button id="rp-open">日報PDFを開く</button><button id="rp-x" class="ghost">閉じる</button>');
  document.getElementById("rp-open").onclick = ()=>{ close(); if(!window.open(url, "_blank")) location.href = url; setTimeout(()=>URL.revokeObjectURL(url), 300000); };
  document.getElementById("rp-x").onclick = ()=>{ close(); URL.revokeObjectURL(url); };
}
// 「データを転送」: 日報PDFと生データCSVの2ファイルを作り、共有する(メール・LINE・AirDropなど)
// 共有の操作は、ボタンを押した直後でないと端末に拒否されることがある。PDFが裏で作成済みならその場で共有し、
// 作成中なら「作成しています…」を出して、できあがったら「共有する」ボタンを出す。
async function shareFiles(files){
  try{
    if(navigator.canShare && navigator.canShare({files})) await navigator.share({files, title:"運転日報"});
    else{ files.forEach((f,i)=>setTimeout(()=>saveFile(f), i*400)); alert("この端末では共有画面を開けないため、ファイルをダウンロードしました"); }
  }catch(e){ /* 共有の取りやめ */ }
}
async function transferData(){
  const m = document.getElementById("modal"), close = ()=>{ m.innerHTML = ""; };
  const panel = inner => { m.innerHTML = `<div class="mback"><div class="panel mpanel" role="dialog" aria-modal="true">${inner}</div></div>`; };
  let cancelled = false;
  const ready = pdfCache && pdfCache.key===nippoKey() && pdfCache.file;
  if(!ready){
    panel('<p class="msg" style="font-size:20px">日報PDFとCSVを作成しています…</p><button id="tx-x" class="ghost">閉じる</button>');
    document.getElementById("tx-x").onclick = ()=>{ cancelled = true; close(); };
  }
  const pdf = ready ? pdfCache.file : await pdfFile();
  if(cancelled) return;
  const csv = csvFile();
  if(!pdf){
    panel(`<p class="msg" style="font-size:20px">日報PDFを作成できませんでした</p><p class="note">原因: ${escH((pdfErr && (pdfErr.message || pdfErr.name)) || "不明")}</p>
      <button id="tx-csv" class="alt">CSVを共有</button><button id="tx-x" class="ghost">閉じる</button>`);
    document.getElementById("tx-csv").onclick = ()=>shareFiles([csv]);
    document.getElementById("tx-x").onclick = close; return;
  }
  panel(`<p class="msg" style="font-size:20px">データを転送</p>
    <p class="note">Wechatに①日報PDFと②CSVを両方共有してください。</p>
    <button id="tx-pdf">日報PDFを共有</button><button id="tx-csv" class="alt">CSVを共有</button>
    <button id="tx-x" class="ghost">閉じる</button>`);
  const $m = id => document.getElementById(id);
  $m("tx-pdf").onclick = ()=>shareFiles([pdf]);
  $m("tx-csv").onclick = ()=>shareFiles([csv]);
  $m("tx-x").onclick = close;
}

// ---- 描画 ----
function odoInput(label){
  return `<label for="odo">${label}</label><div class="vrow"><input id="odo" type="number" inputmode="numeric" min="0" step="1" placeholder="例: 123456">${micBtns("odo")}</div>`;
}
function readOdo(oid="odo", eid="err"){
  const v = document.getElementById(oid).value.trim();
  const e = document.getElementById(eid);
  if(!/^\d+$/.test(v)){ e.textContent = "Odoメーターを数値で入力してください"; return null; }
  e.textContent = ""; return v;
}
// 直前の「到着」(その後に給油だけが続く場合を含む)の位置。なければ -1
function replaceIdx(){
  let j = S.rows.length-1; while(j>=0 && S.rows[j].kind==="給油") j--;
  return (j>=0 && (S.rows[j].kind==="回送で到着" || S.rows[j].kind==="実車で到着")) ? j : -1;
}
// 直前に記録したOdo(帰庫のために直前の到着を置き換える場合は、その到着を除く)
function lastOdo(skipLastArrival){
  const rows = S.rows.slice();
  if(skipLastArrival){ const ri = replaceIdx(); if(ri>=0) rows.splice(ri,1); }
  for(let i=rows.length-1; i>=0; i--){ if(/^\d+$/.test(String(rows[i].odo))) return Number(rows[i].odo); }
  return null;
}
// Odoの確認ダイアログ(かけ離れている/ほとんど変わらない場合)
function askOdo(msg, prev, odo, inputId, onYes){
  const m2 = document.getElementById("modal2");
  m2.innerHTML = `<div class="mback"><div class="panel mpanel" role="alertdialog" aria-modal="true">
    <p class="msg">${msg}</p>
    <p class="note">前回: ${prev} km　→　今回: <b>${escH(odo)}</b> km</p>
    <button id="c-yes">この数値で入力</button>
    <button id="c-no" class="ghost">やっぱり間違えたので訂正</button></div></div>`;
  document.getElementById("c-yes").onclick = ()=>{ m2.innerHTML = ""; onYes(); };
  document.getElementById("c-no").onclick = ()=>{
    m2.innerHTML = ""; const el = document.getElementById(inputId); if(el){ el.focus(); el.select(); } };
}
function place(kind, ids){
  ids = ids || {odo:"odo", err:"err", status:"status"};
  const run = async (confirmed)=>{
    let odo = "";
    if(kind!=="出発"){
      odo = readOdo(ids.odo, ids.err);
      if(odo===null) return;
      const prev = lastOdo(false);
      if(prev!==null){
        const d = Number(odo) - prev;
        if(d<=0){ document.getElementById(ids.err).textContent = "前回の入力値より大きな値を入力してください"; return; }
        if(!confirmed && (d>=100 || d<=3)){
          askOdo(d>=100 ? "前回の入力値からかなりかけ離れていますが、正しいですか？"
                        : "前回の入力値とあまり変わらないですが、正しいですか？",
                 prev, odo, ids.odo, ()=>run(true));
          return;
        }
      }
    }
    const status = document.getElementById(ids.status);
    document.querySelectorAll("button").forEach(b=>b.disabled=true);
    // 「違法帰庫」「違法出庫」ボタンは、記録上の種別は「帰庫」「乗務開始」(位置情報は取得せず固定住所)
    const FIXED = {"違法帰庫":["帰庫","東小松川２"], "違法出庫":["乗務開始","東小松川２"]};
    const fx = FIXED[kind], rowKind = fx ? fx[0] : kind;
    const p = fx ? {lat:"", lng:"", addr:fx[1]}
                 : await getPlace(t=>{ if(status) status.textContent = t; });
    addRow(rowKind, {odo, ...p});
    go(rowKind==="帰庫" ? "done" : (rowKind==="出発"||rowKind==="乗務開始") ? "arrive" : "depart");
  };
  return ()=>run(false);
}

// ---- 運行指示書(shijisho.html を画面いっぱいに表示。幅1100pxの紙面を画面幅に合わせて縮小し、ピンチで拡大できる) ----
function openShijisho(){
  const q = new URLSearchParams({embed:"1"}); if(S.vehicle) q.set("carPlate", S.vehicle); if(S.driver) q.set("driver", S.driver);
  const W = 1100, sc = Math.min(1, document.documentElement.clientWidth / W), m = document.getElementById("modal2");
  m.innerHTML = `<div class="mback" style="padding:0;background:var(--bg);display:flex;flex-direction:column;align-items:stretch">
    <div class="shbar">
      <span style="display:flex;align-items:center;gap:6px"><button id="shj-prev">戻る</button><b id="shj-pg" style="min-width:48px;text-align:center">1 / 1</b><button id="shj-next">次へ</button></span>
      <span style="display:flex;gap:6px"><button id="shj-print" class="ghost">印刷</button><button id="shj-close">閉じる</button></span>
    </div>
    <div style="flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch">
      <div id="shj-wrap" style="width:${W*sc}px;height:${1150*sc}px;margin:0 auto">
        <iframe id="shj-frame" title="運行指示書" src="shijisho.html?${q.toString()}" style="width:${W}px;height:1150px;border:0;background:#fff;transform:scale(${sc});transform-origin:0 0"></iframe>

// ---- Odoメーターの音声入力(日本語 / 中文) ----
// 聞き取った文を数値に直す。「59846」「5 9 8 4 6」「五万九千八百四十六」「5万9846」「ごーきゅうはちよんろく」「五九八四六」などに対応
const VDIG = {"〇":0,"零":0,"一":1,"二":2,"两":2,"兩":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9,"幺":1};
const VUNIT = {"十":10,"百":100,"千":1000};
function vSection(s){   // 万の位より下(千・百・十を含む)
  let total = 0, num = "";
  for(const c of s){
    if(VUNIT[c]){ total += (num==="" ? 1 : Number(num)) * VUNIT[c]; num = ""; }
    else num += (/\d/.test(c) ? c : VDIG[c]);
  }
  return total + (num==="" ? 0 : Number(num));
}
function kanaDigits(t){   // ひらがな・カタカナだけの読み上げ(例: ごーきゅうはちよんろく)
  const s = t.replace(/[ァ-ヶ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/[ー\s、,，。]/g, "");
  if(!s || /[^ぁ-ん]/.test(s)) return null;
  const toks = [["きゅう",9],["ぜろ",0],["しち",7],["さん",3],["よん",4],["ろく",6],["なな",7],["はち",8],["れい",0],["まる",0],["いち",1],["に",2],["ご",5],["し",4],["く",9],["よ",4]];
  let out = "", i = 0;
  while(i < s.length){ const m = toks.find(([k])=>s.startsWith(k, i)); if(!m) return null; out += m[1]; i += m[0].length; }
  return out;
}
function speechToOdo(raw){
  let t = String(raw).normalize("NFKC").trim();
  const k = kanaDigits(t);
  let n = null;
  if(k !== null) n = Number(k);
  else{
    t = t.replace(/キロメートル|キロ|公里|千米|km/gi, "");
    t = t.replace(/(\d)[\s,，、]+(?=\d)/g, "$1").replace(/(\d)[\s,，、]+(?=\d)/g, "$1");
    const runs = t.match(/[0-9〇零一二三四五六七八九两兩幺十百千万萬]+/g);
    if(!runs) return null;
    const m = runs.sort((a,b)=>b.length-a.length)[0];
    if(/[万萬]/.test(m)){ const [l, r=""] = m.split(/[万萬]/); n = (l ? vSection(l) : 1)*10000 + (r ? vSection(r) : 0); }
    else if(/[十百千]/.test(m)) n = vSection(m);
    else n = Number([...m].map(c=>/\d/.test(c) ? c : VDIG[c]).join(""));
  }
  return (Number.isFinite(n) && n >= 0 && n <= 9999999) ? String(n) : null;
}
const VKEY = "unten-voice-lang", SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const vlang = ()=>{ try{ return localStorage.getItem(VKEY)==="zh" ? "zh" : "ja"; }catch(e){ return "ja"; } };

const micBtns = id => `<button type="button" class="micBtn" data-for="${id}" aria-label="音声入力">🎤</button>`;
const VSTAT = {"odo":"status", "m-odo":"m-status", "f-odo":"status"};
// 音声認識エンジンは、話し終えてから約1秒の無音を待って結果を確定する(この待ち時間はアプリ側では変えられない)。
// そこで途中経過の認識結果を使い、途中経過が変わらなくなってから EARLY_MS ミリ秒で先に入力する。
// 確定した結果がそれと違えば、確定結果で上書きする(入力欄を手で直した場合は上書きしない)。
const EARLY_MS = 300;
let curRec = null;
function listenOdo(inputId, btn){
  const say = t => { const e = document.getElementById(VSTAT[inputId]); if(e) e.textContent = t; };
  if(curRec){ try{ curRec.stop(); }catch(e){} return; }                      // 録音中にもう一度押すと停止
  if(!SR){ say("この端末・ブラウザでは音声入力を使えません。手入力してください。"); return; }
  const rec = new SR(); curRec = rec;
  rec.lang = vlang()==="zh" ? "zh-CN" : "ja-JP"; rec.interimResults = true; rec.maxAlternatives = 5; rec.continuous = false;
  btn.classList.add("rec"); say(vlang()==="zh" ? "请说出里程数…" : "Odoメーターの数字を話してください…");
  let got = false, filled = null, timer = null;
  const fill = (v, t, force)=>{
    const el = document.getElementById(inputId);
    if(el && (force || filled === null || el.value === filled)){ el.value = v; el.dispatchEvent(new Event("input", {bubbles:true})); filled = v; }
    say(`「${t}」→ ${v} と聞き取りました。確認してください。`);
  };
  rec.onresult = ev=>{
    const res = ev.results[ev.results.length-1];
    const alts = Array.from(res).map(a=>a.transcript);
    if(!res.isFinal){                                    // 途中経過: 数値に読めて、EARLY_MS 変化がなければ先に入力する
      clearTimeout(timer);
      const v = speechToOdo(alts[0]);
      if(v !== null) timer = setTimeout(()=>{ if(curRec === rec) fill(v, alts[0]); }, EARLY_MS);
      return;
    }
    clearTimeout(timer); got = true;
    for(const t of alts){
      const v = speechToOdo(t);
      if(v !== null){ fill(v, t); return; }
    }
    if(filled === null) say(`数値として聞き取れませんでした(「${alts[0]}」)。もう一度、または手入力してください。`);
  };
  rec.onerror = ev=>{
    clearTimeout(timer); got = true;
    if(filled !== null) return;                          // 先に入力できていれば、そのまま使う
    const msg = {"not-allowed":"マイクの使用が許可されていません。", "service-not-allowed":"音声入力が許可されていません。", "no-speech":"音声が聞こえませんでした。",
      "network":"音声認識には通信が必要です。", "audio-capture":"マイクが見つかりません。", "language-not-supported":"この言語には対応していません。"}[ev.error];
    say((msg || "音声入力に失敗しました。") + "手入力もできます。");
  };
  rec.onend = ()=>{ clearTimeout(timer); btn.classList.remove("rec"); curRec = null; if(!got && filled === null) say("聞き取れませんでした。もう一度お試しください。"); };
  try{ rec.start(); }catch(e){ btn.classList.remove("rec"); curRec = null; say("音声入力を開始できませんでした。"); }
}

    }else if(k==="乗務開始"||k==="出発"){
      g.push({type:"leg", items:[i], open:true});
    }else if(k==="給油"){
      // 出発〜到着の間なら同じ枠、到着〜出発の間なら給油だけの独立した枠
      if(last && last.type==="leg" && last.open) last.items.push(i); else g.push({type:"fuel", items:[i]});
    }else if(k==="休憩"){
      if(last && last.type==="leg" && last.open) last.items.push(i); else g.push({type:"rest", items:[i]});
    }else if(k==="回送で到着"||k==="実車で到着"){
      if(last && last.type==="leg" && last.open){ last.items.push(i); last.open = false; }
      else g.push({type:"leg", items:[i], open:false});
    }else if(k==="帰庫"){
      if(last && last.type==="leg" && last.open){ last.items.push(i); last.open = false; }
      else g.push({type:"end", items:[i]});
    }else{
      g.push({type:"end", items:[i]});
    }
  });
  return g;
}
// ---- データの合体 ----
// 合体できる組: 出発(乗務開始)から到着(帰庫)まで完結した枠。seg は間に別種の枠が挟まらない連なりの番号
function isSelLeg(g){
  if(g.type!=="leg" || g.open) return false;
  const a = S.rows[g.items[0]].kind, b = S.rows[g.items[g.items.length-1]].kind;
  return (a==="乗務開始" || a==="出発") && (b==="回送で到着" || b==="実車で到着" || b==="帰庫");
}
function legsOf(gs){
  const legs = []; let seg = 0;
  gs.forEach(g=>{ if(isSelLeg(g)) legs.push({g, seg}); else if(g.type!=="fuel" && g.type!=="rest") seg++; });
  return legs;
}
// 連続した組だけ選べる: 追加は両端の隣のみ、解除は両端のみ
function mergeAllowed(o, legs){
  if(!mergeSel.length) return true;
  const mn = mergeSel[0], mx = mergeSel[mergeSel.length-1];
  if(legs[o].seg !== legs[mn].seg) return false;
  return mergeSel.includes(o) ? (o===mn || o===mx) : (o===mn-1 || o===mx+1);
}
function openMerge(){
  const legs = legsOf(groupRows());
  if(mergeSel.length<2) return;
  const sel = mergeSel.map(o=>legs[o].g);
  const line = g => { const a = S.rows[g.items[0]], b = S.rows[g.items[g.items.length-1]];
    return `<div class="mini">${escH(a.time)} ${escH(a.addr||"(住所なし)")}<br>→ ${escH(b.time)} ${escH(b.addr||"(住所なし)")}${b.odo!==""?` / ${escH(b.odo)} km`:""}</div>`; };
  const first = S.rows[sel[0].items[0]], lastG = sel[sel.length-1], last = S.rows[lastG.items[lastG.items.length-1]];
  document.getElementById("modal").innerHTML = `<div class="mback"><div class="panel mpanel" role="dialog" aria-modal="true" style="max-height:92dvh;overflow:auto">
    <p class="msg">これらの運行を合体します。</p>
    ${sel.map(line).join("")}
    <p class="note">合体後: 出発 ${escH(first.addr||"(住所なし)")} → 到着 ${escH(last.addr||"(住所なし)")}</p>
    <button id="mg-ok">OK</button><button id="mg-no" class="ghost">キャンセル</button></div></div>`;
  document.getElementById("mg-ok").onclick = ()=>doMerge(sel);

}
function doMerge(sel){
  const keepStart = sel[0].items[0], lastG = sel[sel.length-1], keepEnd = lastG.items[lastG.items.length-1];
  const del = new Set(), CORE = ["乗務開始","出発","回送で到着","実車で到着","帰庫"];
  sel.forEach(g=>g.items.forEach(i=>{ if(CORE.includes(S.rows[i].kind) && i!==keepStart && i!==keepEnd) del.add(i); }));
  const endRow = S.rows[keepEnd];
  endRow.note = (endRow.note ? endRow.note+" / " : "") + `合体(${sel.length}組)`;
  S.rows = S.rows.filter((_,i)=>!del.has(i));   // 途中の出発・到着を除く(給油は残す)

const ARR = ["回送で到着","実車で到着"];
const STEP_AFTER = {"業務開始":"inspect","日常点検":"scan","出発点呼":"odoStart","乗務開始":"arrive",
  "出発":"arrive","回送で到着":"depart","実車で到着":"depart","帰庫":"done"};
// 「出発」と「到着」は組で消す(乗務開始に続く最初の到着は、到着だけを消す)
function pairIdx(i){
  const k = S.rows[i].kind, idx = [i];
  if(k==="出発"){
    let j = i+1; while(S.rows[j] && S.rows[j].kind==="給油"){ idx.push(j); j++; }
    if(S.rows[j] && ARR.includes(S.rows[j].kind)) idx.push(j);
  }else if(ARR.includes(k)){
    let j = i-1; const f = [];
    while(j>=0 && S.rows[j].kind==="給油"){ f.push(j); j--; }
    if(j>=0 && S.rows[j].kind==="出発") idx.push(j, ...f);
  }
  return idx;
}
function deleteRow(i){
  const idx = pairIdx(i);
  const list = idx.slice().sort((a,b)=>a-b).map(j=>`・${S.rows[j].kind} ${S.rows[j].time}`).join("\n");
  if(!confirm(`次の記録を消去します。よろしいですか？\n${list}`)) return;
  S.rows = S.rows.filter((_,j)=>!idx.includes(j));
  const m = S.rows.slice().reverse().find(r=>r.kind==="出発点呼");
  S.manager = m ? mgrFromNote(m.note) : "";
  let li = S.rows.length-1; while(li>=0 && (S.rows[li].kind==="給油" || S.rows[li].kind==="休憩")) li--;
  const last = S.rows[li];
  S.step = last ? (STEP_AFTER[last.kind] || "arrive") : "home";
  editIdx = null; editGrp = null; save(); render();
}
// ---- 枠と枠の間へのデータ手入力(挿入) ----

// 到着(pos-1)から次の出発までが40分以上あいていて、まだ休憩がなければ、休憩時間(到着+5分〜出発-5分)を返す
function restGap(pos){
  const a = S.rows[pos-1]; if(!a || !ARR.includes(a.kind)) return null;
  let j = pos;
  while(S.rows[j] && (S.rows[j].kind==="給油" || S.rows[j].kind==="休憩")){ if(S.rows[j].kind==="休憩") return null; j++; }
  const d = S.rows[j]; if(!d || d.kind!=="出発") return null;
  const ta = new Date(a.time.replace(" ","T")).getTime(), td = new Date(d.time.replace(" ","T")).getTime();
  if(isNaN(ta) || isNaN(td) || td-ta < 40*60000) return null;
  const f = ms => { const x = new Date(ms); return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())} ${pad(x.getHours())}:${pad(x.getMinutes())}:${pad(x.getSeconds())}`; };
  return {start:f(ta+5*60000), end:f(td-5*60000)};
}
function odoBounds(pos){
  const f = (start, dir) => { for(let j=start; j>=0 && j<S.rows.length; j+=dir){
    if(/^\d+$/.test(String(S.rows[j].odo))) return {o:Number(S.rows[j].odo), k:S.rows[j].kind}; } return null; };
  return {pv:f(pos-1,-1), nx:f(pos,1)};
}
function saveInsert(){
  const pos = insPos, g = id => document.getElementById(id), err = g("i-err"), leg = insMode==="leg";
  if(insMode==="rest"){
    const gp = restGap(pos);
    if(!gp){ err.textContent = "この位置には休憩を入れられません"; return; }
    S.rows.splice(pos, 0, makeRow("休憩", {time:gp.start, end:gp.end, addr:g("i-addr").value.trim(), note:"手入力"}));
    insPos = null; insMode = null; save();
    if(S.step==="done") render(); else renderLog();
    return;
  }
  const fix = v => { let t = v.replace("T"," "); if(t.length===16) t += ":00"; return t; };
  if(!g("i-time").value){ err.textContent = "日時を入力してください"; return; }
  const time1 = fix(g("i-time").value);
  let time2 = null, kind = null;
  if(leg){
    const on = logEl.querySelector(".seg.on");
    if(!on){ err.textContent = "回送で到着か実車で到着かを選んでください"; return; }
    kind = on.dataset.v;
    if(!g("i-time2").value){ err.textContent = "到着日時を入力してください"; return; }
    time2 = fix(g("i-time2").value);
    if(time2 < time1){ err.textContent = "到着日時は出発日時より後にしてください"; return; }
  }
  const prevT = (S.rows[pos-1]||{}).time, nextT = (S.rows[pos]||{}).time, lastT = time2 || time1;
  if((prevT && time1 < prevT) || (nextT && lastT > nextT)){ err.textContent = "日時が前後の記録の間になっていません"; return; }
  const odo = g("i-odo").value.trim();
  if(!/^\d+$/.test(odo)){ err.textContent = "Odoメーターを数値で入力してください"; return; }
  const {pv, nx} = odoBounds(pos), n = Number(odo);
  if(pv && (leg ? n<=pv.o : n<pv.o)){ err.textContent = "前回の入力値より大きな値を入力してください"; return; }
  if(nx && ((!leg || nx.k==="給油") ? n>nx.o : n>=nx.o)){ err.textContent = "次の記録の値より小さな値を入力してください"; return; }
  let amt = "";
  if(!leg){
    amt = g("i-amt").value.trim();
    if(!/^\d+(\.\d+)?$/.test(amt) || Number(amt)<=0){ err.textContent = "給油量を数値で入力してください"; return; }
  }
  const addr = g("i-addr").value.trim(), note = "手入力";
  if(leg) S.rows.splice(pos, 0, makeRow("出発", {time:time1, note}), makeRow(kind, {time:time2, odo, addr, note}));
  else S.rows.splice(pos, 0, makeRow("給油", {time:time1, odo, fuel:amt, addr, note}));
  insPos = null; insMode = null; save();
  if(S.step==="done") render(); else renderLog();
}
// 1件ぶんの入力欄を読み取って検証する。成功: {v}、失敗: {err}
function readRowFields(r, p){
  const g = id => document.getElementById(p+id), v = {};
  let t = g("time").value;
  if(!t) return {err:`「${r.kind}」の日時を入力してください`};
  t = t.replace("T"," "); if(t.length===16) t += ":00";
  v.time = t; v.odo = r.odo; v.lat = r.lat; v.lng = r.lng; v.addr = r.addr; v.fuel = r.fuel; v.end = r.end;
  if(HAS_ODO.includes(r.kind)){
    v.odo = g("odo").value.trim();
    if(!/^\d+$/.test(v.odo)) return {err:`「${r.kind}」のOdoメーターを数値で入力してください`};
  }
  if(r.kind==="休憩"){
    v.addr = g("addr").value.trim();
    let te = g("end").value;
    if(!te) return {err:"休憩の終了日時を入力してください"};
    te = te.replace("T"," "); if(te.length===16) te += ":00";
    if(te < t) return {err:"休憩の終了日時は開始日時より後にしてください"};
    v.end = te;
  }
  if(HAS_PLACE.includes(r.kind)){
    v.addr = g("addr").value.trim(); v.lat = g("lat").value.trim(); v.lng = g("lng").value.trim();
    if((v.lat && !/^-?\d+(\.\d+)?$/.test(v.lat)) || (v.lng && !/^-?\d+(\.\d+)?$/.test(v.lng)))
      return {err:`「${r.kind}」の緯度・経度は数値で入力してください`};
  }
  if(r.kind==="給油"){
    v.fuel = g("fuel").value.trim();
    if(!/^\d+(\.\d+)?$/.test(v.fuel) || Number(v.fuel)<=0) return {err:"給油量を数値で入力してください"};
  }
  if(r.kind==="業務開始"){
    v.veh = g("veh").value.trim(); v.drv = g("drv").value.trim();
    if(!/^\d+$/.test(v.veh)) return {err:"担当車の番号を数値で入力してください"};
  }
  if(r.kind==="出発点呼"){ v.mgr = g("mgr").value; v.note = `運行管理者・整備管理者(補助者): ${v.mgr}`; }
  else v.note = g("note").value.trim();
  return {v};
}
// 修正後の記録全体で、日時の順序とOdoメーターの増え方が正しいかを確認する。問題なければ空文字
function checkEdit(idxs, vals){
  const nr = S.rows.map((r,j)=>{ const k = idxs.indexOf(j); return k>=0 ? {...r, ...vals[k]} : r; });
  const tm = t => t.slice(5,19);
  const first = idxs[0], last = idxs[idxs.length-1];
  // 出発(乗務開始)から到着(帰庫)までの枠は、到着が出発より後でなければならない
  const a0 = nr[first], b0 = nr[last];
  if(idxs.length>1 && (a0.kind==="出発"||a0.kind==="乗務開始") && (ARR.includes(b0.kind)||b0.kind==="帰庫") && !(a0.time < b0.time))
    return `「${b0.kind}」(${tm(b0.time)})は、「${a0.kind}」(${tm(a0.time)})より後の日時にしてください`;
  for(let j=Math.max(0,first-1); j<=Math.min(nr.length-2,last); j++){
    const a = nr[j], b = nr[j+1], inA = idxs.includes(j), inB = idxs.includes(j+1);
    if(a.time <= b.time) continue;
    if(inA && inB) return `「${b.kind}」(${tm(b.time)})が「${a.kind}」(${tm(a.time)})より前になっています。日時の順序を直してください`;
    if(!inA) return `「${b.kind}」は、前の記録「${a.kind}」(${tm(a.time)})より後の日時にしてください`;
    return `「${a.kind}」は、次の記録「${b.kind}」(${tm(b.time)})より前の日時にしてください`;
  }
  for(const i of idxs){
    const r = nr[i]; if(!HAS_ODO.includes(r.kind)) continue;
    const n = Number(r.odo);
    const near = dir => { for(let j=i+dir; j>=0 && j<nr.length; j+=dir){ if(/^\d+$/.test(String(nr[j].odo))) return {o:Number(nr[j].odo), k:nr[j].kind}; } return null; };
    const pv = near(-1), nx = near(1);
    if(pv && (r.kind==="給油" ? n<pv.o : n<=pv.o)) return `「${r.kind}」のOdoメーターは、前の記録(${pv.o} km)より大きな値にしてください`;
    if(nx && ((r.kind==="給油"||nx.k==="給油") ? n>nx.o : n>=nx.o)) return `「${r.kind}」のOdoメーターは、次の記録(${nx.o} km)より小さな値にしてください`;
  }
  return "";
}
function applyEdit(r, v){
  r.time = v.time; r.odo = v.odo; r.lat = v.lat; r.lng = v.lng; r.addr = v.addr; r.note = v.note;
  if(r.kind==="休憩") r.end = v.end;
  if(r.kind==="給油") r.fuel = v.fuel;
  if(r.kind==="業務開始"){ S.vehicle = v.veh; S.driver = v.drv; }
  if(r.kind==="出発点呼") S.manager = v.mgr;
}
function finishEdit(){
  editIdx = null; editGrp = null; save();
  updateMeta();
  if(S.step==="done") render(); else renderLog();
}
function saveEdit(i){
  const r = S.rows[i], err = document.getElementById("e-err");
  const x = readRowFields(r, "e-");
  if(x.err){ err.textContent = x.err; return; }
  const e = checkEdit([i], [x.v]);
  if(e){ err.textContent = e; return; }
  applyEdit(r, x.v); finishEdit();
}
// 出発〜到着の枠の一括保存。1件でも誤りがあれば、どれも保存しない
function saveGroupEdit(){
  const idxs = editGrp.slice(), err = document.getElementById("g-err"), vals = [];
  for(let n=0; n<idxs.length; n++){
    const x = readRowFields(S.rows[idxs[n]], `g${n}-`);
    if(x.err){ err.textContent = x.err; return; }
    vals.push(x.v);
  }
  const e = checkEdit(idxs, vals);
  if(e){ err.textContent = e; return; }
  idxs.forEach((idx,n)=>applyEdit(S.rows[idx], vals[n]));
  finishEdit();
}
const $ = id => document.getElementById(id);
function bind(st){
  if(st==="home"){
    const veh = $("veh"), btn = $("start");
    const upd = ()=>{ btn.disabled = !/^\d+$/.test(veh.value.trim()); };   // 未入力の間は押せない
    veh.oninput = upd; upd();
    btn.onclick = ()=>{ if(btn.disabled) return; S.vehicle = veh.value.trim(); S.driver = $("drv").value.trim(); addRow("業務開始"); go("inspect"); };
  }
  if(st==="inspect"){
    $("ok").onclick = ()=>{ addRow("日常点検", {note:"異常なし"}); go("scan"); };
    $("chk").onclick = ()=>openCheck();
  }
  if(st==="scan") bindPick();
  if(st==="odoStart") $("begin").onclick = place("乗務開始");
  if(st==="arrive"){
    $("kaiso").onclick = place("回送で到着");
    $("jissha").onclick = place("実車で到着");
  }
  if(st==="depart") $("dep").onclick = place("出発");
  if(st==="fuel"){
    $("fuelBack").onclick = ()=>go(S.fuelFrom || "arrive");
    $("fuelGo").onclick = recordFuel;
  }

  if(st==="done"){
    $("post").onclick = ()=>openCheck("終業後点検", POST_ITEMS);
    $("mkpdf").onclick = openReport;
    $("xfer").onclick = transferData;
    $("rep").onclick = ()=>{ reportOpen = !reportOpen; render(); if(reportOpen){ const t = $("rep-t"); t.focus(); t.scrollIntoView({block:"center", behavior:"smooth"}); } };
    if(reportOpen){
      const t = $("rep-t"); let timer = null;
      t.oninput = ()=>{ S.report = t.value; S.reportTime = t.value.trim() ? now() : ""; save();
        clearTimeout(timer); timer = setTimeout(pdfFile, 800); };   // 入力が止まったらPDFを作り直しておく
      $("rep-close").onclick = ()=>{ reportOpen = false; render(); };
    }
    pdfFile();
    $("reset").onclick = ()=>{
      document.getElementById("modal").innerHTML = `<div class="mback"><div class="panel mpanel" role="dialog" aria-modal="true">
        <p class="msg" style="font-size:34px;text-align:center;margin:8px 0 16px">お疲れ様でした</p>
        <p style="margin:0 0 12px;line-height:1.6">今回のデータを含めて過去３回分の日報データは保存されます。必要に応じてご自身で保存してください</p>
        <button id="end-ok">OK</button><button id="end-no" class="ghost">キャンセル</button></div></div>`;
      $("end-no").onclick = ()=>{ document.getElementById("modal").innerHTML = ""; };
      $("end-ok").onclick = ()=>{ archiveCurrent(); S = fresh(); reportOpen = false; save(); render(); };
    };
  }
}

// ---- オフライン対応 ----
// 住所が未取得の行(緯度経度のみ)は、通信が戻ったときに自動で住所を補完する
let resolving = false;
async function resolvePending(){
  if(resolving || !navigator.onLine) return;
  const todo = S.rows.filter(r=>r.lat && !r.addr);
  if(!todo.length) return;
  resolving = true;
  for(const r of todo){
    try{ r.addr = await reverseGeocode(r.lat, r.lng); save(); }catch(e){ break; }
    await new Promise(ok=>setTimeout(ok,1100)); // 無料サーバーへの負荷配慮
  }
  resolving = false;
  if(editIdx===null && insPos===null && !reportOpen){ if(S.step==="done") render(); else renderLog(); }
}
function updateNet(){
  const n = $("net"); if(!n) return;
  n.textContent = navigator.onLine ? "オンライン" : "オフライン";
  n.className = navigator.onLine ? "" : "off";
  if(navigator.onLine) resolvePending();
}
window.addEventListener("online", updateNet);
window.addEventListener("offline", updateNet);
updateNet();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
// 乗務中に画面が消えないようにする
let wl=null;
async function keepAwake(){ try{ if(S.step!=="home" && S.step!=="done") wl = await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") keepAwake(); });
keepAwake();
render();
</script>
