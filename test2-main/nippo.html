<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乗務日報</title>
<style>
    *{box-sizing:border-box}
    body{font-family:'Helvetica Neue',Arial,sans-serif;background:#f0f4f8;color:#333;margin:0;padding:0}
    .toolbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
    .toolbar button{background:#2c3e50;color:#fff;padding:10px 24px;border:none;border-radius:4px;cursor:pointer;font-size:1em}
    .toolbar .back{background:#95a5a6}
    #fit{overflow:hidden}
    /* 紙面は幅1200の座標で作り、画面幅・用紙幅に合わせて縮小する */
    .sheet{width:1200px;margin:0 auto 20px;background:#fff;padding:20px 0 20px;zoom:var(--z,1);color:#333}
    .title{margin:0;height:44px;line-height:36px;text-align:center;font-size:22.5px;font-weight:bold;color:#2c3e50;border-bottom:2px solid #2c3e50}
    .hd{margin-top:20px;height:70px;background:#f8f9fa;border:1px solid #dee2e6;border-radius:8px;padding:12px 0 0 10px;display:flex;gap:12px}
    .hd .it label{display:block;font-size:13px;color:#555;line-height:18px;margin-bottom:2px}
    .hd .val{font-size:15px;font-weight:bold;color:#2c3e50;line-height:26px}
    .hd .date{font-size:13px;font-weight:bold;color:#2c3e50;line-height:26px;text-align:center;align-self:flex-end;padding-bottom:12px}
    .hd input{width:185px;height:26px;border:1px solid #ccc;border-radius:4px;padding:2px 6px;font:inherit;font-size:14px;background:#fff}
    .main{display:flex;gap:18px;margin-top:15px}
    .left{width:260px;flex:none}
    .right{width:922px;flex:none}
    .lbl{height:20px;line-height:20px;font-size:16px;font-weight:bold;color:#2c3e50;margin-bottom:10px}
    .lbl.g{margin-top:15px}
    .box{height:34px;border:1px solid #7f8c8d;border-radius:4px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:bold}
    table{border-collapse:collapse;width:100%;table-layout:fixed}
    th,td{border:1px solid #bdc3c7;text-align:center;vertical-align:middle;padding:0 4px}
    th{background:#ecf0f1;color:#2c3e50;font-weight:bold}
    .chk td{height:27.8px;text-align:left;padding:0 7px;font-size:12px;color:#222;white-space:nowrap}
    .chk td+td{width:52px;text-align:center;padding:0}
    .chk td{overflow:hidden}
    .run{font-size:11px}
    .run th,.run td{height:25px;padding:0 3px}
    .stamps{display:flex;justify-content:center;gap:19px;margin-top:19px;position:relative}
    .seal{position:absolute;top:0;left:50%;width:67px;height:67px;transform:translateX(-50%);object-fit:cover;pointer-events:none}
    .stamp{width:67px;height:67px;border:1px solid #333;background:#fff;display:flex;flex-direction:column}
    .stamp .t{font-size:8px;text-align:center;border-bottom:1px solid #333;padding:2px 0;line-height:1.1;color:#222}
    .stamp .m{flex:1;display:flex;align-items:center;justify-content:center;color:#e0e0e0;font-size:28px}
    .bottom{display:flex;gap:19px;margin-top:20px}
    .bottom .lbl{margin-bottom:8px}
    .fuel{width:305px}
    .fuel table{font-size:11px}
    .fuel th,.fuel td{height:36px}
    .fuel .diag{background:linear-gradient(to top right,transparent 49.5%,#bdc3c7 49.5%,#bdc3c7 50.5%,transparent 50.5%)}
    .fuel .lbl.g{margin-top:11px;margin-bottom:9px}
    .post{width:303px}
    .post table td{height:25px;padding:0 9px;font-size:11px;color:#222}
    .post td div{display:flex;justify-content:space-between}
    .rep{margin-top:9px;height:198px;border:1px solid #bdc3c7;border-radius:4px;padding:3px 4px;font-size:12px;font-weight:bold;color:#2c3e50}
    .rep{position:relative;overflow:hidden}
    .rep .rb{margin-top:6px;font-weight:normal;font-size:12px;line-height:1.45;color:#222;white-space:pre-wrap;word-break:break-all}
    /* 報告事項が空のとき: 枠の右上と左下を結ぶ斜線 */
    .rep.none{background:linear-gradient(to top left,transparent calc(50% - .75px),#555 calc(50% - .75px),#555 calc(50% + .75px),transparent calc(50% + .75px));background-origin:border-box}
    .rest{width:276px;text-align:center}
    .rest .lbl{text-align:center;margin:28px 0 7px}
    .rest table{font-size:11px}
    .rest th,.rest td{height:25px}
    .rest td.rp{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
    .rest .stamp{margin:9px auto 0}
    .alc{font-size:10px;margin-top:6px;color:#333;white-space:nowrap}
    .cir{display:inline-block;border:1px solid #000;border-radius:50%;line-height:1.2;padding:0 .25em;margin:-.1em -.2em}

    @media print{
        @page{size:A4 landscape;margin:10mm}
        body{background:#fff}
        .toolbar{display:none!important}
        #fit{overflow:visible}
        .sheet{zoom:.873;margin:0 auto;padding:0}
        .hd input{border-color:transparent;background:transparent}
    }
</style>
</head>
<body>
<div class="toolbar"><button class="back" onclick="location.href='index.html'">戻る</button><button onclick="window.print()">印刷する</button></div>
<div id="fit"><div class="sheet" id="sheet"></div></div>

<script>
"use strict";
// 運転日報アプリ(index.html)が端末に保存した今回の記録だけを転記する
let S = {rows:[]};
try{ S = JSON.parse(localStorage.getItem("unten-nippo-v1")) || S; }catch(e){}
const rows = S.rows || [];
const esc = v => String(v==null ? "" : v).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hm = t => t ? String(t).slice(11,16) : "";
const cir = t => `<span class="cir">${t}</span>`;
const WD = ["日","月","火","水","木","金","土"];
const first = k => rows.find(r=>r.kind===k);
const last = k => rows.slice().reverse().find(r=>r.kind===k);
const start = first("業務開始"), kosei = first("乗務開始"), kiko = last("帰庫");
const t0 = (start || rows[0] || {}).time;
let dateStr = "";
if(t0){ const d = new Date(t0.slice(0,10)+"T00:00:00");
  dateStr = `${d.getFullYear()}年${String(d.getMonth()+1).padStart(2,"0")}月${String(d.getDate()).padStart(2,"0")}日 (${WD[d.getDay()]})`; }
const veh = S.vehicle || "";

// 出発→到着の1組ごと。帰庫で終わる組(出発→帰庫)は回送とみなす
const legs = []; let cur = null;
rows.forEach(r=>{
  if(r.kind==="乗務開始" || r.kind==="出発") cur = r;
  else if(r.kind==="回送で到着" || r.kind==="実車で到着" || r.kind==="帰庫"){
    legs.push({dep:cur, arr:r, type: r.kind==="実車で到着" ? "実車" : "回送"}); cur = null;
  }
});
const fuels = rows.filter(r=>r.kind==="給油");

// 始業点呼を実施した運行管理者のしるし(画像)を、左下の2つの押印マスにまたがって貼る
const MGR = ["中村泰輔","内田麗子","内田洋"];
let mgr = S.manager || "";
if(!MGR.includes(mgr)){ const r0 = last("出発点呼"); mgr = (r0 && MGR.find(n=>String(r0.note||"").endsWith(n))) || ""; }
const seal = mgr ? `<img class="seal" src="${encodeURIComponent(mgr)}.png" alt="${esc(mgr)}">` : "";

const CHECK = ["エンジン（かかり具合・異音）","ブレーキ（踏みしろ・きき具合）","パーキングブレーキ（ひきしろ）","ワイパー（消耗具合）",
  "ウィンドウォッシャー液","方向指示器","ブレーキオイル","ラジエータ・ファンベルト","エンジンオイル・バッテリー","ライト類",
  "タイヤ（空気圧・消耗・溝）","スペアタイヤ","非常信号用具","車検証"];
const stamp = t => `<div class="stamp"><div class="t">${t}</div><div class="m">印</div></div>`;
const yn = t => `<div><span>${t}</span><span>有・${cir("無")}</span></div>`;

const runRows = Array.from({length:Math.max(10, legs.length)}, (_,i)=>{
  const L = legs[i];
  const k = L ? `${L.type==="回送"?cir("回送"):"回送"}・${L.type==="実車"?cir("実車"):"実車"}` : "回送・実車";
  return `<tr><td>${k}</td><td>${L&&L.dep?esc(L.dep.addr||""):""}</td><td>${L&&L.dep?hm(L.dep.time):""}</td>
    <td>${L?esc(L.arr.addr||""):""}</td><td>${L?hm(L.arr.time):""}</td><td>${L?esc(L.arr.odo):""}</td><td></td></tr>`;
}).join("");
const ZEN = ["１","２","３","４","５","６","７","８","９"];
const fuelRows = Array.from({length:Math.max(2, fuels.length)}, (_,i)=>{
  const f = fuels[i];
  return `<tr><th>${ZEN[i]||(i+1)}回目</th><td>${f?esc(f.odo):""}</td><td>${f?esc(f.fuel):""}</td></tr>`;
}).join("");
const reportText = String(S.report||"").trim();   // 報告事項(空なら斜線)
// 休憩(アプリで記録した休憩時間・休憩場所)。3行に満たない分は空欄
const rests = rows.filter(r=>r.kind==="休憩");
const restRows = Array.from({length:Math.max(3, rests.length)}, (_,i)=>{
  const r = rests[i];
  return r ? `<tr><td>${hm(r.time)}　〜　${hm(r.end)}</td><td class="rp">${esc(r.addr||"")}</td></tr>`
           : `<tr><td>：　　〜　　：</td><td></td></tr>`;
}).join("");

document.getElementById("sheet").innerHTML = `
<h2 class="title">乗務日報（運転記録）${veh ? " - "+esc(veh) : ""}</h2>
<div class="hd">
  <div class="date" style="width:140px">${esc(dateStr)}</div>
  <div class="it" style="width:94px"><label>車両名</label><div class="val">${esc(veh)}</div></div>
  <div class="it" style="width:133px"><label>車両番号</label><div class="val"></div></div>
  <div class="it"><label>運転者氏名</label><input type="text" value="${esc(S.driver||"")}"></div>
</div>
<div class="main">
  <div class="left">
    <div class="lbl">業務開始時刻</div><div class="box">${hm(start&&start.time)}</div>
    <div class="lbl g">出庫時ODO</div><div class="box">${esc(kosei?kosei.odo:"")}</div>
    <div class="lbl g">乗務前点検・点呼の実施状況</div>
    <table class="chk">${CHECK.map(t=>`<tr><td>${t}</td><td>◯</td></tr>`).join("")}</table>
    <div class="stamps">${stamp("運行管理者<br>（補助者）")}${stamp("整備管理者<br>（補助者）")}${seal}</div>
  </div>
  <div class="right">
    <div class="lbl">運送の記録</div>
    <table class="run"><thead><tr>
      <th style="width:74px">回送・実車</th><th style="width:165px">出発場所</th><th style="width:120px">出発時刻</th><th style="width:165px">到着場所</th>
      <th style="width:120px">到着時刻</th><th style="width:166px">到着時ODO</th><th>備考</th></tr></thead>
      <tbody>${runRows}</tbody></table>
    <div class="bottom">
      <div class="fuel">
        <div class="lbl">給油</div>
        <table><tr><td class="diag" style="width:33%"></td><th style="width:33%">走行距離</th><th>給油量</th></tr>${fuelRows}</table>
        <div class="lbl g">業務終了時刻</div><div class="box">${hm(kiko&&kiko.time)}</div>
        <div class="lbl g">帰庫時ODO</div><div class="box">${esc(kiko?kiko.odo:"")}</div>
      </div>
      <div class="post">
        <div class="lbl">業務後点呼の状況</div>
        <table><tr><td style="width:50%">${yn("車両の異常")}</td><td>${yn("交通事故")}</td></tr>
        <tr><td>${yn("忘れ物等")}</td><td>${yn("体調の異常")}</td></tr></table>
        <div class="rep${reportText ? "" : " none"}"><div class="rt">報告事項（事故・忘れ物等）</div>${reportText ? `<div class="rb">${esc(reportText)}</div>` : ""}</div>
      </div>
      <div class="rest">
        <div class="lbl">休憩</div>
        <table><tr><th>休憩時間</th><th style="width:85px">休憩場所</th></tr>${restRows}</table>
        ${stamp("運行管理者<br>（補助者）")}
        <div class="alc">□　アルコール検知器による検知無し</div>
      </div>
    </div>
  </div>
</div>`;

// 報告事項が枠に収まらないときは文字を小さくして全文を載せる
(function(){ const box = document.querySelector(".rep"), rb = box && box.querySelector(".rb");
  if(!rb) return; let fs = 12;
  while(box.scrollHeight > box.clientHeight + 1 && fs > 6){ fs -= 0.5; rb.style.fontSize = fs + "px"; } })();

// 画面幅に合わせて縮小表示(印刷時は用紙に合わせて縮小)
function fit(){ document.getElementById("sheet").style.setProperty("--z", Math.min(1, document.documentElement.clientWidth/1200)); }
fit(); addEventListener("resize", fit);
</script>
</body>
</html>
